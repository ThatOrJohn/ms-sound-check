# Region definition. Everything region-specific lives here; the pipeline code is generic.
id: ms
name: Mississippi Sound
timezone: America/Chicago
map: {center: [30.30, -88.95], zoom: 9}

# Display units for this region's audience. Data is stored in SI.
units: {temp: F, rain: in, flow: cfs, salinity: ppt}

sites:
  # --- water stations (USGS / MDMR cooperative network) ---
  - id: USGS-301429089145600
    name: Merrill Shell Bank
    short: West Sound
    kind: sound
    source: usgs
    lat: 30.2414
    lon: -89.2489
    vars: [salinity, water_temp]
    salinity_from: conductance   # USGS salinity series is gappy; derive from conductance
    note: Western Sound, closest to the Pearl River. Freshens first.
    drains_from: [USGS-02489500, basin-pearl, USGS-02481510]
  - id: USGS-302318088512600
    name: Point Cadet (Back Bay)
    short: Biloxi Back Bay
    kind: sound
    source: usgs
    lat: 30.3883
    lon: -88.8572
    vars: [salinity, water_temp]
    salinity_from: conductance
    note: Mouth of Biloxi's Back Bay. Responds to local rain and the Biloxi/Tchoutacabouffa rivers.
    drains_from: [local-biloxi, USGS-02481000]
  - id: USGS-301849088350000
    name: Round Island
    short: East Sound
    kind: sound
    source: usgs
    lat: 30.3136
    lon: -88.5833
    vars: [salinity, water_temp]
    salinity_from: conductance
    note: Eastern Sound off Pascagoula. Follows the Pascagoula River.
    drains_from: [USGS-02479000, basin-pascagoula]
  - id: USGS-301141089320300
    name: East Pearl River
    short: Pearl River mouth
    kind: estuary
    source: usgs
    lat: 30.1947
    lon: -89.5341
    vars: [salinity, water_temp]
    salinity_from: conductance
    in_text: the Pearl River mouth   # how a sentence names it ("Water at the Pearl River mouth")
    note: Lower East Pearl near the Sound. Usually fresh; salt here means the river is low.
    drains_from: [USGS-02489500]

  # --- retired stations: salinity sensors stopped in 2024. Shown as virtual-sensor estimates only. ---
  - id: USGS-301912088583300
    name: Gulfport Light
    short: Gulfport Light
    kind: sound
    source: usgs
    retired: true
    lat: 30.3203
    lon: -88.9758
    vars: [salinity]
    salinity_from: conductance
    note: Off Gulfport Harbor. The salinity sensor stopped reporting in August 2024; readings here are estimated from nearby stations and river flow.
    drains_from: [USGS-02489500]
  - id: USGS-301527088521500
    name: East Ship Island Light
    short: East Ship Island
    kind: sound
    source: usgs
    retired: true
    lat: 30.2575
    lon: -88.8708
    vars: [salinity]
    salinity_from: conductance
    note: Near the Ship Island pass, where Gulf water enters the Sound. The salinity sensor stopped reporting in December 2024; readings here are estimated.
    drains_from: [USGS-02479000]

  # --- rivers ---
  - id: USGS-02489500
    name: Pearl River near Bogalusa
    short: Pearl River
    kind: river
    source: usgs
    lat: 30.7932
    lon: -89.8209
    vars: [flow]
    osm_names: [Pearl River, East Pearl River, West Pearl River]   # river lines to highlight on the map
    drains_from: [basin-pearl]
  - id: USGS-02479000
    name: Pascagoula River at Merrill
    short: Pascagoula River
    kind: river
    source: usgs
    lat: 30.9774
    lon: -88.7259
    vars: [flow]
    osm_names: [Pascagoula River, East Pascagoula River, West Pascagoula River]
    drains_from: [basin-pascagoula]
  # Smaller coastal rivers with live gauges. `minor` keeps them out of the headline, the readout tiles and the
  # virtual-sensor inputs: their flow is a small fraction of the Pearl's or Pascagoula's.
  - id: USGS-02481510
    name: Wolf River near Landon
    short: Wolf River
    kind: river
    minor: true
    source: usgs
    lat: 30.4836
    lon: -89.2744
    vars: [flow]
    note: A smaller coastal river that empties into the Bay of St. Louis, with the Jourdan. Matters most for the bay and the western Sound off it.
    osm_names: [Wolf River]
  - id: USGS-02481000
    name: Biloxi River at Wortham
    short: Biloxi River
    kind: river
    minor: true
    source: usgs
    lat: 30.5586
    lon: -89.1219
    vars: [flow]
    note: A smaller coastal river that empties into Biloxi's Back Bay, with the Tchoutacabouffa. Matters most for the Back Bay.
    osm_names: [Biloxi River]

  # --- river stage gauge used by MDMR's oyster management plan ---
  - id: NWS-PERL1
    name: Pearl River near Pearl River, LA
    short: Pearl River stage
    kind: gauge
    source: nwps          # NWS water prediction service: observed + official stage forecast
    nws_lid: PERL1
    history_usgs: "02492600"   # USGS site for the daily stage history (backfill)
    lat: 30.385
    lon: -89.7367
    vars: [stage]
    note: The gauge MDMR's shellfish management plan uses to close and reopen conditionally approved oyster areas. NWS issues stage forecasts here year-round.
    drains_from: [USGS-02489500]

  # --- weather ---
  - id: NWS-KGPT
    name: Gulfport-Biloxi Airport
    short: Coast weather
    kind: weather
    source: nws
    station: KGPT
    forecast_point: [30.37, -89.08]   # NWS 7-day forecast for the Gulfport waterfront
    lat: 30.4073
    lon: -89.0701
    vars: [air_temp]
  - id: local-biloxi
    name: Biloxi rainfall
    short: Coast rain
    kind: rain
    source: openmeteo
    points: [[30.40, -88.90]]
    vars: [rain]
  - id: wind-sound
    name: Wind over the Sound
    short: Sound wind
    kind: wind
    source: openmeteo
    note: Hourly wind over the middle of the Sound (ERA5 reanalysis for history, model analysis for recent days), averaged by day.
    points: [[30.25, -89.0]]
    vars: [wind_u, wind_v, wind_max]
  # Measured water level (NOAA CO-OPS), daily mean above mean sea level. Context for salinity step events only
  # (decision 0030); not shown as a card or station page.
  - id: NOAA-8735180
    name: Dauphin Island water level
    short: Gulf water level
    kind: water_level
    source: coops
    station: "8735180"
    lat: 30.25
    lon: -88.075
    vars: [water_level]
    note: NOAA's tide gauge at Dauphin Island, AL. Its daily mean shows wind and Gulf pushing water up or drawing it down.
  - id: rain-hancock
    name: Hancock County rainfall
    short: Hancock County rain
    kind: rain
    source: openmeteo
    note: Approximate stand-in for the Hancock County Utility Authority gauge MDMR's plan uses for rainfall closures.
    points: [[30.31, -89.33]]
    vars: [rain]
  - id: basin-pearl
    name: Pearl River basin rainfall
    short: Pearl basin rain
    kind: rain
    source: openmeteo
    note: Approximate - average of a few points across the basin above Bogalusa.
    points: [[32.30, -90.18], [32.77, -89.12], [31.25, -89.85], [31.70, -90.40]]
    vars: [rain]
  - id: basin-pascagoula
    name: Pascagoula River basin rainfall
    short: Pascagoula basin rain
    kind: rain
    source: openmeteo
    note: Approximate - average of a few points across the Leaf/Chickasawhay basins.
    points: [[31.33, -89.29], [31.69, -89.13], [31.67, -88.65], [31.15, -88.56]]
    vars: [rain]

# Rivers that reach the Sound but have no live flow gauge (the Jourdan's and the Escatawpa's are tidal or
# discontinued; the Tchoutacabouffa has none). Drawn and named on the map, and mentioned with the river cards.
ungauged_rivers:
  - {name: Jourdan River, into: the Bay of St. Louis, osm_names: [Jourdan River]}
  - {name: Tchoutacabouffa River, into: Biloxi's Back Bay, osm_names: [Tchoutacabouffa River]}
  - {name: Escatawpa River, into: the Pascagoula River near its mouth, osm_names: [Escatawpa River]}

# Beach water quality (bacteria, debris, harmful algal blooms) from MDEQ's public feature service.
beaches:
  name: MDEQ Beach Monitoring Program
  url: https://mgis19.mdeq.ms.gov/arcgis/rest/services/Hosted/BeachMonitoringView/FeatureServer
  link: https://beaches.mdeq.ms.gov/
  stations_layer: 0
  segments_layer: 1

# MDMR press releases from its public WordPress API, filtered by title to season notices.
# Category 6 is News & Updates; Public Notices (7) repeats the same orders as legal text.
mdmr_notices:
  name: Mississippi Department of Marine Resources
  api: https://dmr.ms.gov/wp-json/wp/v2/posts
  categories: [6]
  topics:
    shrimp: {search: shrimp, title: "shrimp season|shrimping", link: "https://dmr.ms.gov/shrimp/"}
    # Season openings, closures and growing-area changes; not meetings, aquaculture training or leases.
    oyster: {search: oyster, title: "oyster season|oyster harvest|oyster reefs|oyster relay|growing waters",
             exclude: "meeting|aquaculture|training|lease", link: "https://dmr.ms.gov/shellfish/"}

# MDMR's own season pages (decision 0044), read through the same WordPress API: the Shrimp & Crab page's status box
# (open or closed by area) and the newest public oyster season page (season text, orders, days with no harvest).
mdmr_pages:
  api: https://dmr.ms.gov/wp-json/wp/v2/pages
  pages:
    shrimp_status: {slug: shrimp-crab}
    oyster_season: {search: public oyster season, slug_pattern: '\d{4}-\d{4}-public-oyster-season'}

# MDMR's shellfish growing-water classes for the map (decision 0043). Only ZONE_ID and CONDITIONS are read: the
# layer's Status field is hand-kept and lags MDMR's orders, and open or closed is MDMR's call.
shellfish_areas:
  name: Mississippi Department of Marine Resources
  url: https://services5.arcgis.com/CYWvDQNfmlrPP5Rh/arcgis/rest/services/Oyster_Harvest_Zones/FeatureServer
  layer: 0
  link: https://dmr.ms.gov/shellfish/

# Tide predictions (NOAA CO-OPS), west to east.
# NWS coastal waters forecast zone for wave heights in the fishing outlook (api.weather.gov/zones/forecast/<id>).
marine_zone: {id: GMZ532, name: Mississippi Sound}

tides:
  - {id: "8747437", name: Bay Waveland Yacht Club}
  - {id: "8745557", name: Gulfport Harbor}
  - {id: "8741533", name: Pascagoula NOAA Lab}

# Independent salinity references (GCOOS ERDDAP; NDBC for Grand Bay). Not shown as cards; a station listed in `checks` is flagged
# suspect when it runs far saltier than its usual gap to the reference (msc/models/reference.py).
reference:
  - id: GCOOS-DISL_DISL
    dataset: DISL_DISL
    name: Dauphin Island Sea Lab
    place: Dauphin Island, AL                 # shown at the map's east edge: just past the basemap, Mobile Bay side
    lat: 30.2513
    lon: -88.0778
    link: https://erddap.gcoos.org/erddap/tabledap/DISL_DISL.html
    checks: [USGS-301849088350000]
  # Grand Bay NERR's Bangs Lake sonde, from NDBC's realtime files (decision 0045). A marsh lagoon east of Round Island,
  # not open Sound; no history before its first run here.
  - id: NDBC-GDQM6
    source: ndbc
    station: gdqm6
    name: Grand Bay NERR, Bangs Lake
    place: Grand Bay, MS
    lat: 30.357
    lon: -88.463
    link: https://www.ndbc.noaa.gov/station_page.php?station=gdqm6

# Bonnet Carré Spillway (decision 0022). The Corps opens it to keep the Mississippi at New Orleans near 1.25 million cfs,
# about 17 ft on the Carrollton gauge, and the water reaches the western Sound through Lake Pontchartrain and Lake Borgne.
# Nothing public says live whether it's open, so we watch the river (NWS stage + forecast) and keep past openings in
# data/spillway_openings.csv by hand. `sound_site` is the station used to show what the Sound did during past openings.
spillway:
  gauge_lid: NORL1
  gauge_name: Mississippi River at New Orleans (Carrollton)
  open_ft: 17
  watch_ft: 15
  sound_site: USGS-301429089145600
  openings: spillway_openings.csv
  link: https://www.mvn.usace.army.mil/Missions/Mississippi-River-Flood-Control/Bonnet-Carre-Spillway-Overview/

# Satellite map layers from NOAA CoastWatch ERDDAP (decision 0023). Each is the newest clear look per pixel over the
# last `days` days, clipped to the map's area. Hidden when the newest pass is older than `max_age_days`.
satellite:
  bbox: [-90.0, 29.9, -88.1, 30.72]     # W, S, E, N: the basemap's bounds
  layers:
    - id: clarity
      label: Water clarity
      dataset: noaacwNPPVIIRSkd490SectorVYDaily
      var: kd_490
      altitude: true
      days: 5
      max_age_days: 4
      log: true
      range: [0.1, 3.0]                 # Kd490, 1/m. Fixed so days compare.
      source: NOAA S-NPP VIIRS, 750 m
    - id: sst
      label: Surface temp
      dataset: noaacwLEOACSPOSSTL3SnrtCDaily
      var: sea_surface_temperature
      quality: {var: quality_level, min: 5}
      days: 3
      max_age_days: 3
      range: scene                      # stretched to this scene's spread, so fronts show
      source: NOAA ACSPO multi-satellite, 2 km

# Water where Vibrio bacteria grow best (decision 0024): warm and moderately salty, averaged over the last `days` days
# so the note doesn't flicker around the cutoff. It's normal here most of April-October, so it's a calm seasonal note
# in its own section, never a Signal or a headline. We don't measure bacteria.
vibrio:
  temp_min_c: 20
  salinity: [5, 25]
  days: 3
  kinds: [sound, estuary]
  season: April through October
  links:
    - {label: Mississippi State Department of Health, url: "https://msdh.ms.gov/Page/23,31053,341.html"}
    - {label: CDC, url: "https://www.cdc.gov/vibrio/prevention/index.html"}

# Fresh-and-hot days near the reefs (decision 0039): daily mean salinity under `salinity_below` and water temperature
# above `temp_above_c` at the same station, measured readings only. A year is compared only if both readings cover
# `min_coverage` of the days in `season_months` (May-October); otherwise it shows as "at least".
oyster_stress:
  salinity_below: 5
  temp_above_c: 25
  season_months: [5, 10]
  min_coverage: 0.8

# Salinity history picture (decision 0028): every day on record, one row per year, on each salinity station's page
# and, for the `home` stations, in a section of its own. The takeaway line compares days under `fresh_below` and
# over `salty_above` at `takeaway_site`. One home station keeps the home page short; the section links the rest.
history:
  home: [USGS-302318088512600]
  takeaway_site: USGS-302318088512600
  fresh_below: 5
  salty_above: 25

# "Years like this one" (decision 0028): the last `days` days of daily log flow in `rivers`, compared with the same days
# in every past year (root-mean-square difference). The `top` closest are named in the river section as background,
# never a forecast, each linking to that year on `link_site`'s history picture, with its line from `notes`.
similar_years:
  rivers: [USGS-02489500, USGS-02479000]
  label: the Pearl and Pascagoula
  days: 60
  min_days: 50
  top: 3
  min_years: 10
  max_rms: 0.5                     # log10 flow; past this, nothing is close enough to name
  link_site: USGS-301429089145600
  notes: notable_years.csv

# Weekly digest (decision 0031): the first scheduled build on or after `weekday` at `hour` (region time) adds an entry
# to the RSS feed, and `python -m msc post` posts it to Bluesky when credentials are set. `keep`: entries in the feed.
digest:
  weekday: friday
  hour: 6
  keep: 12

# Personas re-rank indicators and reorder cards. Add one by adding an entry here.
personas:
  - id: general
    label: Coast (general)
    blurb: What the Sound is doing this week and whether any of it matters.
    focus: [general, oyster, shrimp, fish]
    card_order: [beaches, strip, sound, vibrio, river, history, spillway, rain, weather, estuary]
    map_layers: [depth, rivers, salinity, beaches]
  - id: oyster
    label: Oysters
    blurb: Freshwater stress on reefs. Long stretches under 2 ppt are what kill oysters.
    focus: [oyster, general]
    card_order: [oyster_watch, oyster_stress, strip, spillway, sound, vibrio, river, history, rain, estuary, weather, beaches]
    map_layers: [depth, contours, rivers, salinity, shellfish]
    share: strip          # share image: the Sound west to east in place of the readout tiles (0037)
  - id: shrimp
    label: Shrimp
    blurb: Spring water temperature drives when brown shrimp reach legal size; fresh water pushes them offshore.
    focus: [shrimp, general]
    card_order: [shrimp_season, strip, sound, weather, river, spillway, rain, estuary, beaches]
    map_layers: [depth, contours, rivers]
  - id: fish
    label: Fishing
    blurb: Salinity and water temperature shifts that move bait and fish around the Sound.
    focus: [fish, general]
    card_order: [fishing_outlook, strip, sound, vibrio, weather, rain, river, spillway, estuary, beaches]
    map_layers: [depth, contours, clarity, wind]

indicators:
  # Unusual vs. normal for this time of year, for every station/variable.
  - id: salinity_vs_normal
    type: vs_normal
    var: salinity
    kinds: [sound]
    low_pct: 10
    high_pct: 90
    topics: [general, fish, oyster]
    low_text: "{site} is fresher than usual for {season} ({value} vs. a typical {p50})."
    high_text: "{site} is saltier than usual for {season} ({value} vs. a typical {p50})."
  - id: water_temp_vs_normal
    type: vs_normal
    var: water_temp
    kinds: [sound]
    low_pct: 10
    high_pct: 90
    topics: [general, fish, shrimp]
    low_text: "Water at {site} is running cold for {season} ({value} vs. a typical {p50})."
    high_text: "Water at {site} is running warm for {season} ({value} vs. a typical {p50})."
  - id: river_vs_normal
    type: vs_normal
    var: flow
    kinds: [river]
    low_pct: 10
    high_pct: 90
    topics: [general, oyster, shrimp, fish]
    low_text: "The {site} is running low ({value} vs. a typical {p50}). Expect saltier water downstream."
    high_text: "The {site} is running high ({value} vs. a typical {p50}). Expect fresher water downstream while it stays up."

  # Where the last two weeks rank among the same dates in every year on record (decision 0028). Each year's
  # `window`-day mean needs `min_days` days of data; only a top or bottom `top` rank is said. Replaces the plain
  # vs_normal finding for the same station. Water temperature stays out until its trend question is settled.
  - id: river_record
    type: record
    var: flow
    kinds: [river]
    window: 14
    min_days: 10
    top: 3
    topics: [general, oyster, shrimp, fish]
    low_word: lowest
    high_word: highest
    low_cmp: lower
    high_cmp: higher
    low_text: "The {site} is at its {rank} {season} flow since {since}."
    high_text: "The {site} is at its {rank} {season} flow since {since}."
  - id: stage_record
    type: record
    var: stage
    sites: [NWS-PERL1]
    window: 14
    min_days: 10
    top: 3
    topics: [oyster, general]
    low_word: lowest
    high_word: highest
    low_cmp: lower
    high_cmp: higher
    low_text: "The Pearl River at Pearl River, LA, is at its {rank} {season} level since {since}."
    high_text: "The Pearl River at Pearl River, LA, is at its {rank} {season} level since {since}."
  - id: salinity_record
    type: record
    var: salinity
    kinds: [sound]
    window: 14
    min_days: 10
    top: 3
    topics: [general, fish, oyster]
    low_word: freshest
    high_word: saltiest
    low_cmp: fresher
    high_cmp: saltier
    low_text: "{site} has its {rank} {season} water since {since}."
    high_text: "{site} has its {rank} {season} water since {since}."

  # Oyster freshwater stress. Threshold from NGI/USM spillway research (2026):
  # mortality when salinity stays below ~2 ppt for more than two weeks.
  - id: oyster_fresh_stress
    type: run_below
    var: salinity
    kinds: [sound]
    threshold: 2.0
    watch_days: 5
    warn_days: 10
    alert_days: 14
    topics: [oyster, general]
    text: "{site} has been under {threshold} ppt for {days} straight days. Past two weeks, oyster reefs start dying."

  # Matching salinity steps at two or more stations: Gulf water pushed in, or fresh water pushed out (docs/decisions/0016).
  # One station stepping alone is treated as a sensor problem. `lead_step` is the biggest step the event needs;
  # `min_step` is what the other stations must clear to corroborate it.
  - id: salinity_steps
    type: custom
    fn: msc.models.steps:step_events
    var: salinity
    kinds: [sound, estuary]
    min_step: 3.0
    lead_step: 6.0
    topics: [general, fish, oyster, shrimp]
    wind_site: wind-sound              # wind and river context for each event (decision 0017)
    river_sites: [USGS-02489500, USGS-02479000]
    river_label: the Pearl and Pascagoula rivers
    level_site: NOAA-8735180          # Gulf water level, described when it moved 8 cm (3 in) or more (decision 0030)
    level_label: the water at Dauphin Island, AL,
    lead_min_stations: 3            # an event this wide leads the headline of personas whose first focus is one of lead_topics
    lead_topics: [oyster, fish]
    up_short: "Salinity jumped at {n} stations around {when}, by up to {change} {unit}. That usually means saltier Gulf water moved in."
    down_short: "Salinity dropped at {n} stations around {when}, by up to {change} {unit}. That usually means fresh water moved in."
    up_text: "Salinity jumped at {places} around {when}, by as much as {change} {unit}. Matching jumps at several stations usually mean saltier Gulf water moved into the Sound."
    down_text: "Salinity dropped at {places} around {when}, by as much as {change} {unit}. Matching drops at several stations usually mean fresh water moved into the Sound."

  # Oyster closure watch: MDMR's published criteria for conditionally approved areas.
  # Source: MDMR Molluscan Shellfish Growing Waters Management Plan (Dec 2025 edits). See docs/decisions/0012.
  - id: oyster_closure_watch
    type: custom
    fn: msc.models.oyster:closure_watch
    topics: [oyster]
    gauge: NWS-PERL1
    rain_site: rain-hancock
    plan_name: MDMR Molluscan Shellfish Growing Waters Management Plan (December 2025)
    plan_url: https://dmr.ms.gov/wp-content/uploads/2026/01/Molluscan-Shellfish-Growing-Waters-Management-Plan_12.2025-edits.pdf
    status_url: https://dmr.ms.gov/shellfish/
    hotline: "228-374-5167"
    groups:
      - areas: [I-B, II-A, II-B]
        names: St. Joe, Pass Christian, Henderson Point, Waveland and St. Stanislaus reefs
        stage_ft: 10
        rain_in: {I-B: 1.0, II-A: 1.0, II-B: 0.5}
      - areas: [II-E, II-F, II-G]
        names: Henderson Point, Pass Dredging and Pass Marianne reefs
        stage_ft: 11
        rain_in: {II-E: 2.0, II-F: 2.0, II-G: 2.0}

  # Beach advisories and closures (data: beaches source above).
  - id: beach_status
    type: custom
    fn: msc.models.beaches:findings
    topics: [general, fish]

  # Virtual-sensor QC: every salinity station checked against what its neighbors and the rivers imply.
  # (Configured here so another region can tune or drop it; the model lives in msc/models/virtual.py.)

  # Bonnet Carré Spillway watch: the Mississippi at New Orleans against the level where the Corps has opened it.
  - id: spillway_watch
    type: custom
    fn: msc.models.spillway:findings
    topics: [general, oyster, shrimp, fish]

  # Shrimp season lean from spring water temperature (see docs/feasibility.md).
  - id: shrimp_season_lean
    type: custom
    fn: msc.models.shrimp:season_lean
    active: ["03-15", "06-30"]
    topics: [shrimp]
    sites: [USGS-301429089145600, USGS-302318088512600, USGS-301849088350000]
